# Render Blueprint — https://render.com/docs/blueprint-spec
# Two valid ways to publish this site. Keep exactly one of the two blocks enabled.
services:
  # ── A) build from source (use this while you keep editing the React app) ──────
  - type: web
    name: phosphopower-landing
    runtime: static
    rootDir: .
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Deprecated name for the same behavior was `pullRequestPreviewsEnabled: true`; Render's
    # blueprint spec now wants previews.generation. Omitting it disables PR previews.
    previews:
      generation: automatic
    autoDeployTrigger: commit   # explicit: every push to main deploys, no dashboard toggle needed
    envVars:
      # Render auto-detects and installs dependencies for static sites *in addition to* the
      # build command (render.com/docs/static-sites). This repo's devDependencies include
      # playwright, whose postinstall downloads ~400 MB of browsers — so Render's own install
      # would double the work and can stall the build. Our buildCommand already runs `npm ci`.
      - key: SKIP_INSTALL_DEPS
        value: "true"
      # Vite 8 needs Node ^20.19 || >=22.12. Render's default image can lag, so pin it
      # here as well as in .nvmrc (the two must agree).
      - key: NODE_VERSION
        value: "22"
      # devDependencies include Playwright, which downloads ~400 MB of browsers on a
      # plain `npm ci`. The visual gates never run on Render, so skip the browsers or
      # the build spends minutes fetching binaries and may time out.
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
    headers:
      # hashed filenames can be cached forever; the HTML must not be, or a redeploy
      # looks like it did nothing.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    # No catch-all rewrite — deliberately. Render skips rewrite rules for paths that exist
    # (documented), so /* → /index.html would NOT break /assets/*. It would do something worse
    # here: the footer links /privacy, /terms and /accessibility, none of which are built yet,
    # and a catch-all would answer each of them with the landing page at status 200. A 404 is
    # the honest answer until those pages exist. Add the rewrite the day a router needs one.

  # ── B) publish the prebuilt single file (no Node, no npm, seconds to deploy) ───
  # Run `npm run deploy:sync` and commit deploy/index.html, then swap the block above
  # for this one. Nothing builds on Render, so nothing can fail to build.
  # - type: web
  #   name: phosphopower-landing
  #   runtime: static
  #   branch: main
  #   buildCommand: ""
  #   staticPublishPath: ./deploy
  #   envVars:
  #     - key: SKIP_INSTALL_DEPS   # even with an empty build command Render would npm install
  #       value: "true"           # and fetch playwright's browsers for a build that needs none
  #   headers:
  #     - path: /*
  #       name: Cache-Control
  #       value: public, max-age=0, must-revalidate
