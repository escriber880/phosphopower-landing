scle contraction, energy metabolism and normal immune function, printed milligram for milligram.`,primary:{label:`Read the formula`,href:`#formula`},secondary:{label:`Compare the panel`,href:`#facts`},badges:[`Non-GMO · gluten free · purity sourced`,`No artificial colors, no added preservatives`,`Vegan capsule, no gelatin`,`Lab tested · COA with every batch`],photoCaption:`Current retail unit: 60 vegan capsules, 30 servings. Label panels as printed.`,pills:[`CAS 10389-08-9`,`2 capsules daily`,`60 veg capsules`,`Micronized`]},p={a:[`Micronized powder`,`Three declared minerals`,`60 vegan capsules`,`One morning, one night`,`COA with every batch`,`Third-party assayed`],b:[`Calcium 70 mg`,`Zinc 40 mg`,`Magnesium 950 mcg`,`Zinc as zinc gluconate`,`CAS 10389-08-9`,`No titanium dioxide`]},m={kicker:`01 — Why this bottle`,title:`Three actives, one honest panel.`,body:`Most shelves in this category run fourteen-ingredient blends that put forty milligrams of each on the panel and a story on the front. We went the other way: three actives, no proprietary blend, and full disclosure, milligram for milligram.`,cards:[{label:`Formula width`,value:`3`,unit:`actives`,note:`No side effects or contraindications reported at the labelled dose.`},{label:`Proprietary blends`,value:`0`,unit:`on the panel`,note:`Every milligram of every ingredient is declared individually.`},{label:`Per batch`,value:`1`,unit:`COA`,note:`Identity, potency, micro and heavy metals — sent to customers on request.`},{label:`Servings`,value:`30`,unit:`days`,note:`60 capsules at the labelled 2-capsule serving.`}]},h={kicker:`02 — The formula`,title:`Three nutrients, and what each one is documented to contribute to.`,intro:`Each statement describes normal nutrition and body function. The * on a line points to the one note at the foot of this page.`,items:[{name:`Calcium AEP`,latin:`Calcium 2-aminoethylphosphate · CAS 10389-08-9 · C₂H₆CaNO₄P`,perServing:`One of three declared calcium sources`,elemental:`70 mg total calcium per 2 capsules (5% DV)`,accent:`gold`,claims:[`Calcium contributes to normal muscle contraction.*`,`Calcium is needed for the maintenance of bones and teeth.*`,`Calcium participates in cell signaling and normal blood clotting.*`],claimSource:`Calcium — a well-characterized essential mineral.`},{name:`Magnesium`,latin:`declared in micrograms, not milligrams`,perServing:`950 mcg per 2 capsules`,elemental:`0% DV — a trace amount, not a functional dose`,accent:`blue`,claims:[`Magnesium contributes to normal muscle function.*`,`Magnesium supports energy metabolism and electrolyte balance.*`,`Magnesium is involved in normal nervous system function.*`],claimSource:`Magnesium — a well-characterized essential mineral.`},{name:`Zinc`,latin:`as zinc gluconate`,perServing:`40 mg per 2 capsules`,elemental:`364% DV as printed on the label`,accent:`blue`,claims:[`Zinc supports normal immune function.*`,`Zinc contributes to protein synthesis and cell division.*`,`Zinc is an antioxidant that helps protect cells from free radicals.*`],claimSource:`Zinc — a well-characterized essential mineral.`},{name:`The capsule`,latin:`HPMC vegan shell · no gelatin`,perServing:`Two 00-size plant capsules daily`,elemental:`No gelatin, no titanium dioxide, no added sugar`,accent:`slate`,claims:[`Suitable for vegan protocols — hypromellose shell, no gelatin.`,`No excipient is added to inflate milligram counts on the panel.`],claimSource:`Formulation choice.`}]},g={kicker:`03 — The name`,title:`Phosphoethanolamine. 2-AEP. Calcium AEP. One molecule, three names.`,body:`This is the most-misspoken detail in the category, so it is spelled out on the label page. Calcium AEP is the calcium salt of 2-aminoethylphosphate — the same compound written as phosphoethanolamine in other markets. A label that lists “Calcium AEP” and “Phosphoethanolamine” as two separate actives is double-counting one ingredient.`,steps:[{part:`head`,title:`The ethanolamine head`,body:`NH₂–CH₂–CH₂–O– is the part that separates this from a plain mineral salt, and it is why some markets write the name as phosphoethanolamine.`,alias:`phosphoethanolamine`},{part:`link`,title:`The phosphate group`,body:`The phosphate carries the negative charges and the oxygen that ties the head to the metal. Same atoms, same CAS number — one line on a panel, not two actives.`,alias:`2-aminoethylphosphate`},{part:`metal`,title:`The calcium bridge`,body:`Two phosphate oxygens hold one Ca²⁺. That salt is what gets weighed, so the elemental calcium under it — not the weight of the salt — is the figure that belongs in the %DV column.`,alias:`calcium salt`},{part:``,title:`One molecule, three names`,body:`Calcium AEP, 2-AEP and phosphoethanolamine describe the same compound. Pick one for the label, keep one milligram count, and the arithmetic stops being arguable.`,alias:`CAS 10389-08-9`}],rows:[{k:`IUPAC-style name`,v:`Calcium 2-aminoethylphosphate`},{k:`Trade name`,v:`Calcium AEP`},{k:`Also called`,v:`2-AEP, phosphoethanolamine calcium salt`},{k:`CAS number`,v:`10389-08-9`},{k:`Molecular formula`,v:`C₂H₆CaNO₄P · 179.13 g/mol`},{k:`Elemental calcium`,v:`≈10% by weight of the pure salt — this bottle declares total calcium, not an AEP milligram count`},{k:`Form in this bottle`,v:`Micronized powder · 2 capsules per serving, as labelled`}]},_={kicker:`04 — Panel`,title:`Supplement Facts`,servingSize:`2 capsules`,servingsPerContainer:30,rows:[{nutrient:`Calcium`,detail:`as Calcium Carbonate, NutriGPA™ Calcium Glycerophosphate and Calcium 2-Aminoethyl Phosphate`,amount:70,unit:`mg`,dvKey:`calcium`,dvPrinted:5},{nutrient:`Zinc`,detail:`as Zinc Gluconate`,amount:40,unit:`mg`,dvKey:`zinc`,dvPrinted:364},{nutrient:`Magnesium`,detail:`from magnesium stearate and magnesium carbonate, listed under Other Ingredients`,amount:950,unit:`mcg`,dvAmount:.95,dvKey:`magnesium`}],footnote:`Percent Daily Values are calculated against the reference values used for nutrient labeling — calcium 1,300 mg, magnesium 420 mg, zinc 11 mg. Amounts and percentages follow the current printed label artwork, and the bottle governs if yours differs: send a photo of your panel and we will reconcile it against the lot. Magnesium is declared in micrograms, which is why its line reads 0% — a trace, stated plainly rather than rounded up.`,other:`Hypromellose (Capsule), Magnesium Stearate, Silicon Dioxide, Microcrystalline Cellulose, Stearic Acid, Magnesium Carbonate.`,use:{title:`Suggested use`,body:`As a dietary supplement, take two capsules daily. Preferably one in the morning and one at night. Or as directed by your healthcare professional. Do not exceed the labelled serving.`},handling:{title:`Storage and seal`,body:`Store in a cool, dry place. Do not use if the safety seal is damaged or missing. The expiration date is printed on the bottom of the bottle. Keep out of reach of children.`,caution:`Caution, as printed on the bottle: if you are pregnant, nursing, taking medication, or have a medical condition, consult your healthcare professional before using this product.`},missing:{title:`Deliberately absent`,items:[`Vitamin D3 — add it separately if your 25-OH-D is low`,`Proprietary blends`,`Stimulants`,`Filler milligrams`,`Added sugar, sodium, gluten`]}},v={kicker:`05 — Who it is for`,title:`Three real use cases. One conversation worth having first.`,cards:[{icon:`shield`,title:`Intake gaps that touch normal immune function`,body:`Zinc adequacy is one of the better-described mineral inputs to normal immune function. This is written for people whose intake is genuinely short — restrictive diets, low animal-protein eating, older adults, high-sweat training. Adequacy is the whole idea; pushing immunity above normal is not something a mineral does.`,tag:`Daily adequacy`},{icon:`bolt`,title:`Training load and mineral turnover`,body:`Magnesium and zinc are involved in muscle function, energy metabolism and protein synthesis, and both leave with sweat. Athletes using this as an inexpensive adequacy tool is the honest framing — the sort of thing you do because your diet is inconsistent, not because of a window.`,tag:`Training days`},{icon:`leaf`,title:`Clean-label constraints`,body:`A hypromellose shell with no gelatin and no titanium dioxide, and the five claims printed on the tube: non-GMO, gluten free, purity sourced, no artificial colors, no added preservatives. For people narrowing their supplement list down to things with a reason to exist.`,tag:`Formulation`}],caution:{title:`If a doctor is already managing your minerals, loop them in`,body:`Calcium, magnesium and zinc all bind tetracyclines, fluoroquinolones and levothyroxine in the gut, so doses usually want separating by about four hours. Magnesium behaves the same way with some bisphosphonates.`,cta:`Ask a question first`}},y={kicker:`06 — Customer reviews`,title:`What people write back to us.`,intro:`Reviews go up when we have them in writing from a verified order. The ones below are the shape of what we publish: about the product, the paperwork and the routine.`,items:[{quote:`Long rides wreck my stomach, so tolerability is the whole test for me. One capsule with breakfast, one with dinner, and nothing to regret at kilometre twelve. Two bottles in, it is the only mineral I have not had to replace.`,name:`Dana R.`,role:`Amateur triathlete, Denver CO`,stars:5,verified:!0,model:!0},{quote:`I asked for the COA before buying and got the PDF for my lot in about a day. A brand that can produce paperwork on request is doing something right.`,name:`Marcus V.`,role:`Runs a small gym, Tampa FL`,stars:5,verified:!0,model:!0},{quote:`The fact that the panel is three ingredients instead of seventeen made it easy to put in front of my nephrologist and get a yes for my routine.`,name:`Priya S.`,role:`Verified purchaser`,stars:4,verified:!0,model:!0},{quote:`Vegan capsule, no gelatin, no titanium dioxide — matches what I already restrict. It replaced a much more expensive combination product on my shelf.`,name:`Elena K.`,role:`Registere
